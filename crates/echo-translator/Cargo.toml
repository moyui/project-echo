[package]
name = "echo-translator"
description = "Echo shared translation gateway: multi-provider (DeepL/Baidu/Youdao/LLM) with cache and glossary"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
echo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "5"
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
lru.workspace = true
async-trait = "0.1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "echo-translator"
path = "src/main.rs"
