[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-translator",
    "crates/echo-bindings",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
# rustls：Android 交叉编译没有 OpenSSL/native-tls，全平台统一 rustls
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lru = "0.12"
echo-core = { path = "crates/echo-core" }
echo-translator = { path = "crates/echo-translator" }
