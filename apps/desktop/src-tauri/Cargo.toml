[package]
name = "echo-desktop"
version = "0.1.0"
description = "Echo desktop shell (Tauri)"
license = ""
repository = ""
default-run = "echo-desktop"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
echo-translator = { workspace = true }
echo-ocr = { path = "../../../crates/echo-ocr" }
regex = "1"
image = "0.25"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
